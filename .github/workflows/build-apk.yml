name: Build APK

# Solo se dispara con cambios de código de la app (no con fichas de contenido,
# esas se sincronizan solas en tiempo de ejecución — ver src/datos/contentSync.js).
# El commit final lleva [skip ci] a propósito: si no, este mismo workflow se
# dispararía a sí mismo en bucle al subir su propio resultado (versión/APK/OTA).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '!android/app/build/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - run: npm ci

      # Versión nueva SIEMPRE en cada build — si no, la app nunca detectaría
      # que hay una actualización OTA disponible (misma versión = no hace nada).
      - name: Subir versión de la app
        run: |
          NEW_VERSION=$(node -e "const v=require('./package.json').version.split('.'); v[2]=+v[2]+1; console.log(v.join('.'))")
          npm pkg set version="$NEW_VERSION"
          npm install --package-lock-only
          echo "APP_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - run: npm run cap:sync

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Empaquetar actualización OTA
        run: |
          cd dist-capacitor
          zip -qr ../app-bundle.zip . -x 'content/*'
          cd ..
          CHECKSUM=$(sha256sum app-bundle.zip | cut -d' ' -f1)
          cp app-bundle.zip public/app-bundle.zip
          printf '{"version":"%s","url":"https://app-studio-pri.vercel.app/app-bundle.zip","checksum":"%s"}' \
            "$APP_VERSION" "$CHECKSUM" > public/app-bundle.json

      - name: Publicar cambios
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/app.apk public/app-bundle.zip public/app-bundle.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "chore: versión $APP_VERSION — APK + actualización OTA [skip ci]"
          git push
