<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Libro abierto (formas simples) -->
  <rect x="100" y="140" width="145" height="200" rx="12" fill="white" opacity="0.95"/>
  <rect x="267" y="140" width="145" height="200" rx="12" fill="white" opacity="0.85"/>
  <!-- Lomo -->
  <rect x="243" y="140" width="26" height="200" fill="#0369a1" opacity="0.4"/>
  <!-- Líneas de texto en página izquierda -->
  <rect x="120" y="185" width="105" height="10" rx="5" fill="#bae6fd"/>
  <rect x="120" y="207" width="85" height="10" rx="5" fill="#bae6fd"/>
  <rect x="120" y="229" width="100" height="10" rx="5" fill="#bae6fd"/>
  <rect x="120" y="251" width="70" height="10" rx="5" fill="#bae6fd"/>
  <!-- Líneas en página derecha -->
  <rect x="287" y="185" width="105" height="10" rx="5" fill="#e0f2fe"/>
  <rect x="287" y="207" width="80" height="10" rx="5" fill="#e0f2fe"/>
  <rect x="287" y="229" width="100" height="10" rx="5" fill="#e0f2fe"/>
  <rect x="287" y="251" width="60" height="10" rx="5" fill="#e0f2fe"/>
  <!-- Estrella encima -->
  <polygon points="256,60 270,100 312,100 278,124 292,164 256,140 220,164 234,124 200,100 242,100"
           fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
  <!-- Texto "2P" abajo -->
  <text x="256" y="390" font-family="Arial,sans-serif" font-size="72" font-weight="900"
        fill="white" text-anchor="middle" opacity="0.9">2P</text>
</svg>
